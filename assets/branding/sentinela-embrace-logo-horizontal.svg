<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260">
  <defs>
    <linearGradient id="emlhBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1938"/>
      <stop offset="100%" stop-color="#0F0C1E"/>
    </linearGradient>

    <linearGradient id="emlhTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="emlhBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <radialGradient id="emlhHomeLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>

    <filter id="emlhGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="960" height="260" rx="32" fill="url(#emlhBg)"/>

  <!-- ================= THE "S" EMBRACE ICON (cx=140, cy=130) ================= -->
  <g transform="translate(140, 130) scale(0.24)">
    <!-- Bottom Arm -->
    <path d="M 0 -82
             C 128 -82 218 -22 218 108
             C 218 248 108 318 -12 318
             C -152 318 -242 238 -242 138
             C -242 83 -207 53 -162 53
             C -122 53 -97 83 -97 128
             C -97 178 -57 213 -7 213
             C 48 213 103 173 103 103
             C 103 28 38 3 -32 -12
             Z"
          fill="url(#emlhBottom)"/>

    <!-- Top Arm -->
    <path d="M 0 78
             C -128 78 -218 18 -218 -112
             C -218 -252 -108 -322 12 -322
             C 152 -322 242 -242 242 -142
             C 242 -87 207 -57 162 -57
             C 122 -57 97 -87 97 -132
             C 97 -182 57 -217 7 -217
             C -48 -217 -103 -177 -103 -107
             C -103 -32 -38 -7 32 8
             Z"
          fill="url(#emlhTop)"/>

    <!-- Center House Light -->
    <circle cx="0" cy="0" r="54" fill="url(#emlhHomeLight)" filter="url(#emlhGlow)"/>
    <path d="M 0 -18 L 18 0 L 11 0 L 11 15 L -11 15 L -11 0 L -18 0 Z" fill="#FFFFFF"/>
  </g>

  <!-- Divider Line -->
  <line x1="250" y1="50" x2="250" y2="210" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- ================= TYPOGRAPHY ================= -->
  <g transform="translate(290, 0)">
    <!-- Brand Wordmark -->
    <text x="0" y="130"
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Comfortaa', 'Nunito', sans-serif"
          font-size="64"
          font-weight="800"
          letter-spacing="3"
          fill="#FFFFFF">
      sentinela
    </text>

    <!-- Glowing Heart/Home Dot on the 'i' of sentinela -->
    <circle cx="340" cy="85" r="9" fill="#EC4899" filter="url(#emlhGlow)"/>
    <circle cx="340" cy="85" r="5" fill="#FDE047"/>
    <circle cx="340" cy="85" r="2.5" fill="#FFFFFF"/>

    <!-- Tagline -->
    <text x="3" y="170"
          font-family="system-ui, -apple-system, 'Inter', sans-serif"
          font-size="14.5"
          font-weight="700"
          letter-spacing="2.5"
          fill="#A78BFA">
      O ABRAÇO QUE TE LEVA A CASA
    </text>

    <text x="3" y="198"
          font-family="system-ui, -apple-system, 'Inter', sans-serif"
          font-size="12.5"
          font-weight="500"
          letter-spacing="0.5"
          fill="#94A3B8">
      Caminhos protegidos por quem mais se preocupa contigo
    </text>
  </g>
</svg>