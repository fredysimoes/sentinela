<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260">
  <defs>
    <linearGradient id="lhFriendlyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E38"/>
      <stop offset="100%" stop-color="#101024"/>
    </linearGradient>

    <linearGradient id="lhPinBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <radialGradient id="lhLanternGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#FEF08A"/>
      <stop offset="80%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>

    <linearGradient id="lhWarmLight" x1="50%" y1="20%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0"/>
    </linearGradient>

    <filter id="lhGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="960" height="260" rx="32" fill="url(#lhFriendlyBg)"/>

  <!-- ================= MASCOT ICON (cx=140, cy=130) ================= -->
  <g transform="translate(140, 130)">
    <!-- Light Beam -->
    <path d="M -20 20 L -60 100 Q 0 115 60 100 L 20 20 Z" fill="url(#lhWarmLight)"/>
    <!-- Small home arriving -->
    <path d="M 0 95 L 9 103 L 6 103 L 6 112 L -6 112 L -6 103 L -9 103 Z" fill="#34D399"/>

    <!-- Pin Mascot Body -->
    <path d="M 0 -85
             C 52 -85 82 -52 82 0
             C 82 45 22 102 0 120
             C -22 102 -82 45 -82 0
             C -82 -52 -52 -85 0 -85 Z"
          fill="url(#lhPinBody)"/>

    <!-- Lantern Head / Friendly Face -->
    <circle cx="0" cy="-4" r="54" fill="url(#lhLanternGlow)" filter="url(#lhGlow)"/>

    <!-- Eyes & Smile -->
    <g fill="#1E1B4B">
      <ellipse cx="-21" cy="-8" rx="6.5" ry="9.5"/>
      <circle cx="-19" cy="-12" r="2.8" fill="#FFFFFF"/>

      <ellipse cx="21" cy="-8" rx="6.5" ry="9.5"/>
      <circle cx="23" cy="-12" r="2.8" fill="#FFFFFF"/>

      <!-- Blush -->
      <ellipse cx="-33" cy="4" rx="6" ry="3.2" fill="#F43F5E" opacity="0.45"/>
      <ellipse cx="33" cy="4" rx="6" ry="3.2" fill="#F43F5E" opacity="0.45"/>

      <!-- Smile -->
      <path d="M -9 6 Q 0 13 9 6"
            fill="none"
            stroke="#1E1B4B"
            stroke-width="2.8"
            stroke-linecap="round"/>
    </g>

    <!-- Beacon Headlight Top Halo -->
    <circle cx="0" cy="-88" r="9" fill="#FDE047" filter="url(#lhGlow)"/>
    <circle cx="0" cy="-88" r="4.5" fill="#FFFFFF"/>
  </g>

  <!-- Divider Line -->
  <line x1="250" y1="50" x2="250" y2="210" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- ================= FRIENDLY WORDMARK & TYPOGRAPHY ================= -->
  <g transform="translate(290, 0)">
    <!-- Brand Name: SENTINELA with rounded geometric warmth -->
    <text x="0" y="130"
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Nunito', 'Comfortaa', sans-serif"
          font-size="64"
          font-weight="800"
          letter-spacing="3"
          fill="#FFFFFF">
      sentinela
    </text>

    <!-- Warm beacon dot on the 'i' of sentinela -->
    <circle cx="340" cy="85" r="9" fill="#FDE047" filter="url(#lhGlow)"/>
    <circle cx="340" cy="85" r="4.5" fill="#FFFFFF"/>

    <!-- Friendly Tagline -->
    <text x="3" y="170"
          font-family="system-ui, -apple-system, 'Inter', sans-serif"
          font-size="15"
          font-weight="700"
          letter-spacing="2.5"
          fill="#38BDF8">
      A CAMINHO DE CASA, SEMPRE CONTIGO
    </text>

    <!-- Subtitle descriptor -->
    <text x="3" y="198"
          font-family="system-ui, -apple-system, 'Inter', sans-serif"
          font-size="12.5"
          font-weight="500"
          letter-spacing="0.5"
          fill="#94A3B8">
      Rotas seguras em tempo real &amp; Rede de entreajuda urbana
    </text>
  </g>
</svg>