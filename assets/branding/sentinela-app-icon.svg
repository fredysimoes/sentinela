<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Warm Night Sky Gradient (Amigável, Indigo/Violeta profundo) -->
    <linearGradient id="friendlyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1E38"/>
      <stop offset="50%" stop-color="#14142B"/>
      <stop offset="100%" stop-color="#0E0E1F"/>
    </linearGradient>

    <!-- Warm Golden Beacon Light Beam (Luz acolhedora de candeeiro/guia) -->
    <linearGradient id="warmLightBeam" x1="50%" y1="20%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Friendly Pin Character Body (Soft Gradient Sky/Indigo) -->
    <linearGradient id="pinBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Inner Glow of the Lantern Head -->
    <radialGradient id="lanternGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#FEF08A"/>
      <stop offset="80%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>

    <radialGradient id="ambientWarmAura" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0E0E1F" stop-opacity="0"/>
    </radialGradient>

    <!-- Friendly Soft Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="gentleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- iOS / App Store Squircle Canvas -->
  <rect width="1024" height="1024" rx="230" fill="url(#friendlyBg)"/>

  <!-- Warm Ambient Glow behind character -->
  <circle cx="512" cy="420" r="400" fill="url(#ambientWarmAura)"/>

  <!-- Soft Decorative Street Constellation Dots (Cidade amiga conectada) -->
  <circle cx="260" cy="240" r="6" fill="#FDE047" opacity="0.6"/>
  <circle cx="780" cy="280" r="8" fill="#38BDF8" opacity="0.5"/>
  <circle cx="820" cy="620" r="5" fill="#FDE047" opacity="0.4"/>
  <circle cx="210" cy="660" r="7" fill="#38BDF8" opacity="0.4"/>

  <!-- ================= WARM LIGHT BEAM (O caminho iluminado para casa) ================= -->
  <!-- Um cone de luz suave, arredondado e acolhedor -->
  <path d="M 440 480
           L 240 820
           Q 512 880 784 820
           L 584 480 Z"
        fill="url(#warmLightBeam)"/>

  <!-- Safe Arrival Home Pin / Ponto de Chegada Seguro com Sorriso -->
  <g transform="translate(512, 830)">
    <!-- Pegada / Marcador de chegada -->
    <ellipse cx="0" cy="0" rx="90" ry="24" fill="#0E1726" opacity="0.6"/>
    <!-- Casinha/Destino fofo -->
    <path d="M 0 -38 L 32 -10 L 22 -10 L 22 22 L -22 22 L -22 -10 L -32 -10 Z"
          fill="#34D399"
          filter="url(#gentleGlow)"/>
    <circle cx="0" cy="6" r="6" fill="#FFFFFF"/>
  </g>

  <!-- ================= O PIN-FAROL AMIGO (Personagem Guardião) ================= -->
  <g filter="url(#softShadow)">
    <!-- O Corpo do Pin Arredondado e Amigável -->
    <path d="M 512 160
             C 655 160 740 252 740 395
             C 740 520 570 680 512 730
             C 454 680 284 520 284 395
             C 284 252 369 160 512 160 Z"
          fill="url(#pinBodyGrad)"/>

    <!-- Brilho de Realce Superior (Luz 3D suave no topo da cabeça) -->
    <path d="M 330 330
             C 340 230 420 185 512 185
             C 525 185 530 170 512 170
             C 400 170 315 225 305 330
             C 300 345 325 345 330 330 Z"
          fill="#FFFFFF"
          opacity="0.45"/>

    <!-- A Lente / Rosto Iluminado do Farol (Grande círculo luminoso e acolhedor) -->
    <circle cx="512" cy="385" r="148" fill="url(#lanternGlow)" filter="url(#gentleGlow)"/>

    <!-- Os Olhinhos Atentos e Felizes (Vigilância simpática, não intimidadora) -->
    <g fill="#1E1B4B">
      <!-- Olho Esquerdo Brilhante -->
      <ellipse cx="452" cy="375" rx="19" ry="26"/>
      <circle cx="459" cy="365" r="8" fill="#FFFFFF"/>
      <circle cx="445" cy="385" r="3.5" fill="#FFFFFF"/>

      <!-- Olho Direito Brilhante -->
      <ellipse cx="572" cy="375" rx="19" ry="26"/>
      <circle cx="579" cy="365" r="8" fill="#FFFFFF"/>
      <circle cx="565" cy="385" r="3.5" fill="#FFFFFF"/>

      <!-- Bochechas Coradas de Amizade (Blush) -->
      <ellipse cx="420" cy="408" rx="16" ry="9" fill="#F43F5E" opacity="0.4"/>
      <ellipse cx="604" cy="408" rx="16" ry="9" fill="#F43F5E" opacity="0.4"/>

      <!-- Sorriso Tranquilizador e Confiável -->
      <path d="M 488 412 Q 512 432 536 412"
            fill="none"
            stroke="#1E1B4B"
            stroke-width="7"
            stroke-linecap="round"/>
    </g>

    <!-- Auréola / Pequeno Farol no topo da cabeça -->
    <circle cx="512" cy="148" r="24" fill="#FDE047" filter="url(#gentleGlow)"/>
    <circle cx="512" cy="148" r="12" fill="#FFFFFF"/>
  </g>
</svg>